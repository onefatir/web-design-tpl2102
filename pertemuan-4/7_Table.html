<!DOCTYPE html>
<html lang="en">
<head>
    <title>Table</title>
    <style type="text/css">
        #main {
            width: 100%;
            margin: 0 auto;
            border: 1px solid red;
            padding: 1px;
        }

        #header {
            padding: 1px;
            margin: 1px;
            border: 1px solid black;
            text-align: center;
            height: 100px;
            background-color: #804040;
            color: white;
            font-size: 50px;
        }

        #menu-kiri {
            width: 15%;
            float: left;
            border: 1px solid green;
            margin-right: 2px;
        }

        #menu-kanan {
            width: 15%;
            float: right;
            border: 1px solid yellow;
            margin-right: 2px;
        }

        #menu-kiri div, #menu-kanan div {
            padding: 2px;
            background-color: #ffc58a;
            margin: 2px;
            border: 1px solid blue;
        }

        #isi-tengah {
            width: 69%;
            float: left;
            background-color: #ffa980;
            border: 1px solid blue;
        }

        .bersih {
            float: none;
            clear: both;
        }

        #footer {
            padding: 1px;
            margin: 1px;
            border: 1px solid orange;
            text-align: center;
            background-color: #ffc58a;
            color: white;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="header">
            Perancangan Web
        </div>

        <div id="menu-kiri">
            <div><a>Beranda</a></div>
            <div><a>Profil</a></div>
            <div><a>Akademik</a></div>
            <div><a>Galeri</a></div>
            <div><a>Hubungi Kami</a></div>
        </div>

        <div id="isi-tengah">
            Saya bahagia <br/>
            Saya sehat <br/>
            Saya cantik <br/>
            Saya tampan <br/>
            Saya kaya <br/>
            Saya hebat <br/>
            Saya CEO <br/>
        </div>

        <div id="menu-kanan">
            <div><a>Beranda</a></div>
            <div><a>Profil</a></div>
            <div><a>Akademik</a></div>
            <div><a>Galeri</a></div>
            <div><a>Hubungi Kami</a></div>
        </div>

        <div class="bersih"></div>
        <div id="footer">tpl62</div>
    </div>
</body>
</html>
