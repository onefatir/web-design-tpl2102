<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bullet list selang-seling</title>
        <style type="text/css">
            li.ganjil{
                list-style: disc;
            }
            li.genap{
                list-style:georgian;
            }
        </style>
    </head>
    <body>
        <h4>Nasi Goreng spesial mengandung:</h4>
        <ul>
            <li class="ganjil">cabe super pedas</li>
            <li class="genap">Kecap manis</li>
            <li class="ganjil">Telur 1/2 matang</li>
            <li class="genap">tomat potong</li>
            <li class="ganjil">daging ayam goreng</li>
        </ul>
    </body>
</html>
